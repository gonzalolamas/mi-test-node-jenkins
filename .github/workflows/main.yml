name: Ejecutar script de Node.js

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con el botón en GitHub

jobs:
  run-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar app.js
        run: node app.js
